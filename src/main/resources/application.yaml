server:
  port: 8081

spring:
  application:
    name: java-spring-genai
  ai:
#    model:
#      chat: google-genai
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5.6-luna
    google:
      genai:
        enabled: true
        project-id: project-2f82877b-d936-40db-a65
        location: us-central1
        chat:
          options:
            model:  gemini-2.5-flash
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: mistral:7b
#          max-new-tokens: 512
          temperature: 0.9

logging:
  level:
    root: INFO
    org.springframework.ai.chat.client.advisor: DEBUG
